<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绍兴·风景</title>
  <style>
    /* 页面基础重置 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* 核心：背景图容器 */
    .bg-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background-position: center;
      background-size: cover;
      transition: background-image 1s ease-in-out; /* 1秒的平滑过渡动画 */
    }
    
    /* 默认白天晚霞背景 */
    .bg-layer.day {
      background-image: url('shaoxing.jpg');
    }
    
    /* 夜晚夜景背景 */
    .bg-layer.night {
      background-image: url('shaoxingnight.jpg');
    }

    /* 黑色遮罩层，让文字更清晰 */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.3);
      z-index: -1;
    }

    /* 页面内容布局 */
    body {
      color: white;
      font-family: 'KaiTi', 'STKaiti', serif; /* 使用楷体增加诗意 */
      text-align: center;
      padding: 150px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 { font-size: 3rem; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    p { font-size: 1.2rem; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

    /* 切换按钮样式 */
    .toggle-btn {
      margin-top: 40px;
      padding: 10px 24px;
      border: none;
      border-radius: 30px;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(5px); /* 磨砂玻璃效果 */
      transition: all 0.3s ease;
      outline: none;
    }

    .toggle-btn:hover {
      background-color: rgba(255, 255, 255, 0.5);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- 背景图层 -->
  <div class="bg-layer day" id="bg-layer"></div>
  <!-- 遮罩层 -->
  <div class="overlay"></div>

  <!-- 页面文字 -->
  <h1>诗画江南</h1>
  <p>江南忆，最忆是杭州与绍兴</p>

  <!-- 切换按钮 -->
  <button class="toggle-btn" id="toggle-btn">切换夜景 🌙</button>

  <script>
    // 获取按钮和背景容器
    const btn = document.getElementById('toggle-btn');
    const bgLayer = document.getElementById('bg-layer');

    // 点击事件
    btn.addEventListener('click', function() {
      // 切换 class (day 和 night 来回切换)
      bgLayer.classList.toggle('night');
      
      // 切换按钮文字
      if (bgLayer.classList.contains('night')) {
        btn.textContent = '切换回白天 ☀️';
      } else {
        btn.textContent = '切换夜景 🌙';
      }
    });
  </script>
</body>
</html>
