<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我在绍兴很好</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .bg-layer {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      background-position: center;
      background-size: cover;
      transition: background-image 1s ease-in-out;
    }

    .bg-layer.day {
      background-image: url('shaoxing.jpg');
    }

    .bg-layer.night {
      background-image: url('shaoxingnight.jpg');
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.3);
      z-index: -1;
    }

    body {
      color: white;
      font-family: 'KaiTi', 'STKaiti', serif;
      text-align: center;
      padding: 150px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 { font-size: 3rem; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    p { font-size: 1.2rem; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

    .toggle-btn {
      margin-top: 40px;
      padding: 10px 24px;
      border: none;
      border-radius: 30px;
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      outline: none;
    }

    .toggle-btn:hover {
      background-color: rgba(255, 255, 255, 0.5);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="bg-layer day" id="bg-layer"></div>
  <div class="overlay"></div>

  <h1>我现在在绍兴校区。我在这很好！</h1>

  <button class="toggle-btn" id="toggle-btn">切换夜景 🌙</button>

  <script>
    const btn = document.getElementById('toggle-btn');
    const bgLayer = document.getElementById('bg-layer');

    btn.addEventListener('click', function() {
      bgLayer.classList.toggle('night');

      if (bgLayer.classList.contains('night')) {
        btn.textContent = '切换回落日 ☀️';
      } else {
        btn.textContent = '切换夜景 🌙';
      }
    });
  </script>
</body>
</html>
