<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>FXK的开源网站</title>
  <style>
    /* 全局重置 */
    * {
      margin: 0;
      padding: 0;
    }

    /* 设置全屏背景图 */
    body {
      background-image: url("shaoxing.jpg");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
      color: #fff;
    }

    /* 让文字在背景图上更清晰（加半透明遮罩层） */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: -1;
    }

    /* 内容区域样式 */
    h1 {
      padding: 40px 20px;
      font-size: 28px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    img {
      display: block;
      margin: 20px auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    p {
      text-align: center;
      padding: 20px;
      font-size: 18px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <h1>Hello！ 我现在在杭电绍兴校区 我在这很好！</h1>
  <img src="shaoxing.jpg" alt="晚霞" width="300">
  <p>这是我的第一个开源网站。</p>
</body>
</html>
